<!DOCTYPE html>
<html>
<head>
    <title>Baza danych odczynników</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<header>LabManager - baza danych odczynników</header>
<div id="container">
    <div class="navigation" id="leftNav">

    </div>

    <div id="mainContent">
        <h3>Nazwa strefy</h3>
        <input type="text" id="zoneNameInput"/>

        <h3>Wybierz laboratorium</h3>
        <select id="labSelector" onchange="updateCabinetOptions()">

        </select>

        <h3>Wybierz szafę</h3>
        <select id="cabinetSelector" onchange="updateShelfOptions()">

        </select>

        <h3>Wybierz półkę</h3>
        <select id="shelfSelector">

        </select>


        <br/>

        <button class="formButton" onclick="addZone(event)">Dodaj strefę</button>


    </div>

    <div class="navigation" id="rightNav">

    </div>

</div>
<script src="scripts/loadLeftMenu.js"></script>
<script src="scripts/addZone.js"></script>

</body>
</html>
