<!DOCTYPE html>
<html>
<head>
    <title>Baza danych odczynników</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<header>LabManager - baza danych odczynników</header>
<div id="container">
    <div class="navigation" id="leftNav">

    </div>

    <div id="mainContent">

        <div class="inputsWithHeadersContainer">
            <div class="inputWithHeader">
                <h2>Wyszukaj po nazwach</h2>
                <input type="text" id="searchSubstanceByNameInput" onkeyup="onNameInputChange()"/> <br/>
                <button class="searchButton" onclick="searchByNameAfterButtonClick()">Szukaj po fragmencie nazwy</button>

            </div>

            <div class="inputWithHeader">
                <h2>Wyszukaj po numerze CAS</h2>
                <input type="text" id="searchSubstanceByCasInput" onkeyup="onCasInputChange()"/> <br/>
                <button class="searchButton" onclick="searchByCasAfterClick()">Szukaj po pełnym numerze CAS</button>
            </div>

        </div>

        <h2>Substancje</h2>

        <div id="substanceTilesContainer">

        </div>

    </div>

    <div class="navigation" id="rightNav">

    </div>

</div>
<script src="scripts/loadLeftMenu.js"></script>
<script src="scripts/substancesSearch.js"></script>

</body>
</html>
